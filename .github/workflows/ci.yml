name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Python backend syntax & compilation
        run: |
          python3 -m py_compile server.py

      - name: Validate Frontend JavaScript syntax
        run: |
          for f in static/js/*.js; do
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Validate Shell scripts syntax
        run: |
          bash -n start.sh
